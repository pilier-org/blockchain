version: '3.8'

services:
  pilier-node1:
    container_name: pilier-testnet-node1
    image: pilier-node:latest
    command: |
      /usr/local/bin/pilier-node \
        --base-path /data \
        --chain pilier_testnet \
        --validator \
        --name "Pilier-Testnet-Node1" \
        --rpc-external \
        --rpc-cors all \
        --prometheus-external
    ports:
      - "30333:30333"  # P2P
      - "9944:9944"    # RPC
      - "9615:9615"    # Prometheus
    volumes:
      - pilier-data:/data
    restart: unless-stopped

  pilier-node2:
    container_name: pilier-testnet-node2
    image: pilier-node:latest
    command: |
      /usr/local/bin/pilier-node \
        --base-path /data \
        --chain pilier_testnet \
        --validator \
        --name "Pilier-Testnet-Node2" \
        --port 30334 \
        --rpc-port 9945 \
        --prometheus-port 9616
    ports:
      - "30334:30334"
      - "9945:9945"
      - "9616:9616"
    volumes:
      - pilier-data2:/data
    restart: unless-stopped

volumes:
  pilier-data:
  pilier-data2: